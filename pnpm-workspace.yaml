packages:
  - "apps/web"
  - "apps/api"
  - "packages/*"
  # apps/mobile (Expo) é gerenciado por npm próprio — Metro não convive bem com
  # os symlinks do pnpm. apps/voice é Python (sem package.json).

  # Builds nativos permitidos (allowlist).
onlyBuiltDependencies:
  - esbuild
  - sharp

# Bloqueio explícito do build do tesseract.js (baixa o core em runtime).
# `onnxruntime-node` e `protobufjs` (do @huggingface/transformers, usado na
# reordenação do RAG) também ficam de fora: o pacote já vem com o binário
# pronto para win/linux/mac, e o script de instalação só baixaria de novo.
# Verificado nesta máquina: o reordenador carrega e pontua sem rodar o build.
ignoredBuiltDependencies:
  - tesseract.js
  - onnxruntime-node
  - protobufjs

# pnpm 11.8 trata "build scripts ignorados" como ERRO FATAL em modo não-interativo
# (quebra o `pnpm install --frozen-lockfile` do Docker mesmo com a allowlist acima).
# Isto rebaixa para aviso: esbuild/sharp continuam buildando; tesseract fica ignorado
# sem abortar. Verificado: install limpo do zero passa (exit 0).
strictDepBuilds: false

allowBuilds:
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
