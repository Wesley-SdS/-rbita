<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Órbita</title>
<link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <h1>Órbita no controle</h1>
  <p id="estado" class="estado">Lendo…</p>
  <p id="sessao"></p>
  <button id="parar" type="button" class="perigo">Parar a Órbita</button>
  <p class="dim">As abas em que a Órbita age ficam no grupo colorido "Órbita". Clicar ou digitar numa delas pausa a sessão. A faixa amarela do Chrome avisa que a extensão está no controle; o "Cancelar" dela também para tudo.</p>
  <p id="aviso" class="aviso" role="alert"></p>
  <script src="painel.js"></script>
</body>
