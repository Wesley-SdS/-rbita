[project]
name = "orbita-maos"
version = "0.1.0"
description = "ÓRBITA, as mãos no Windows (PRD-COMPUTADOR-E-NAVEGADOR, frente A): terminal, arquivos, UIA, captura e entrada, só em 127.0.0.1"
# 3.12, o mesmo do apps/perception: dxcam e pywinpty publicam wheel para ele no Windows
requires-python = ">=3.12,<3.13"
# Teto de versão MAIOR em tudo: uma reinstalação não pode trocar sozinha a
# biblioteca que injeta entrada ou lê a árvore de acessibilidade.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.6,<3",
    "psutil>=5.9,<8",
    "pywin32>=306",
    "comtypes>=1.4,<2",
    "uiautomation>=2.0.20,<3",
    "dxcam>=0.0.5,<1",
    "mss>=9,<11",
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
    "pycaw>=20240210",
    "Send2Trash>=1.8,<2",
    "pywinpty>=2.0.13,<4",
    "tree-sitter>=0.23,<1",
    "tree-sitter-bash>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
