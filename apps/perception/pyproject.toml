[project]
name = "orbita-perception"
version = "0.1.0"
description = "ÓRBITA — percepção local (Fase 2): áudio e imagem viram vetores; nada de identidade guardada aqui"
# 3.12: o MediaPipe (gestos, Onda 11) não publica wheel para 3.13+ no Windows
requires-python = ">=3.10,<3.13"
# Teto de versão MAIOR em tudo que mexe com modelo: uma reinstalação não pode
# trocar sozinha o motor que calcula a assinatura (vetor de modelo diferente não
# casa com o que está no banco). Subir um teto aqui é decisão, com recálculo.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "numpy>=1.26,<3",
    "av>=12,<16",
    "sherpa-onnx>=1.10,<2",
    "onnxruntime>=1.18,<2",
    "opencv-python>=4.9,<5",
    "mediapipe>=0.10,<1",
]

# `uv pip install -e .` (ver MEDICAO.md) precisa de um build-system declarado
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perception"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
